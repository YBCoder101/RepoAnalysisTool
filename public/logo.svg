  </defs>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="url(#bg)" stroke="#263351" stroke-width="3"/>
  <!-- ears -->
  <circle cx="21" cy="20" r="8.5" fill="#4f8cff" opacity="0.35"/>
  <circle cx="43" cy="20" r="8.5" fill="#4f8cff" opacity="0.35"/>
